spring.application.name=franquicias

# La URI se toma de la variable de entorno MONGODB_URI.
# Si no existe, se usa un MongoDB local (por ejemplo el de docker-compose).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/franquicias}

# Crea los indices declarados con @Indexed y @CompoundIndex al iniciar.
spring.data.mongodb.auto-index-creation=true
